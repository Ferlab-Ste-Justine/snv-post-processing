name: nf-core CI
# This workflow runs the pipeline with the minimal test dataset to check that it completes without any syntax errors
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/meta.yml"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
      - "LICENSE"
      - ".gitignore"

env:
  NXF_ANSI_LOG: false

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Run pipeline with test data (${{ matrix.NXF_VER }} | ${{ matrix.test_name }} | ${{ matrix.profile }})"
    runs-on: ubuntu-24.04
    strategy:
      # Serialized on purpose: in the quality-control-pipeline, concurrent
      # legs starting within seconds of each other have been observed to
      # all get stuck retrying that same blob until the 1h test-profile time
      # limit kills them -- max-parallel: 1 avoids that by never letting two
      # legs pull it at once. Costs total wall-clock time; trades that for
      # reliability.
      max-parallel: 1
      matrix:
        NXF_VER:
          - "24.10.5"
          - "25.10.4"
        profile:
          - "docker"
        test_name:
          - "test"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Copy test data from S3
        uses: ./.github/actions/copy-test-data
        with:
          aws_access_key_id: ${{ secrets.FERLAB_PUBLIC_DATASET_READ_AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.FERLAB_PUBLIC_DATASET_READ_AWS_SECRET_ACCESS_KEY }}

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@6c2e22b4d901f0c42ca66c5069f8026df026d165 # v2.1.4
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Disk space cleanup
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - name: "Run pipeline with test data ${{ matrix.NXF_VER }} | ${{ matrix.test_name }} | ${{ matrix.profile }}"
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile ${{ matrix.test_name }},${{ matrix.profile }} --outdir ./results

      - name: Display nextflow.log on error
        if: failure()
        run: cat .nextflow.log
